# ThoughtFarm units on one rig. Build from the repo root:  docker compose -f tools/agentkit/docker/compose.yml up -d --build
# Each unit needs its own swarm name and pairing code in ./secrets/UNIT.pair (mode 600; never commit).
x-unit: &unit
  build: { context: ../../.., dockerfile: tools/agentkit/docker/Dockerfile }
  image: sysmedic-agent:latest
  restart: unless-stopped
  tty: true
  stdin_open: true
  extra_hosts: []
services:
  lave-pickle:
    <<: *unit
    container_name: farm-lave-pickle
    environment:
      UNIT_NAME: LAVE-PICKLE
      MODEL: opencode/big-pickle
      MODEL_NAME: "Big Pickle"
      STANCE: "SYNTHESIZER. You read the whole thread, state where the agents agree and exactly where they disagree, and name the one decision the engineer must make. You add a new idea only when a gap is obvious."
    volumes: [ "lave-pickle-data:/data", "lave-pickle-home:/home/agent/.local/share/opencode", "./projects/lave-pickle:/home/agent/projects" ]
    secrets: [ { source: lave-pickle-pair, target: pair } ]
secrets:
  lave-pickle-pair: { file: ./secrets/lave-pickle.pair }
volumes: { lave-pickle-data: {}, lave-pickle-home: {} }
