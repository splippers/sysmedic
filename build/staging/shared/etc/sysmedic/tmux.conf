# SysMedic: the AI sessions shared by the console and the remote AI web terminal.
# No tmux keys at all: no prefix, no bindings, no command prompt. Whoever is attached (the laptop or the
# remote web terminal) can only talk to the AI program; there is no way to open a shell from here.
set -g prefix None
set -g prefix2 None
unbind-key -a
unbind-key -a -T root
unbind-key -a -T copy-mode
unbind-key -a -T copy-mode-vi
# The SysMedic bar across the top: brand, which assistant, and the machine, vault, battery and time
set -g status on
set -g status-position top
set -g status-interval 10
set -g status-style "bg=colour0,fg=colour7"
set -g status-left-length 60
set -g status-right-length 200
set -g status-left "#[fg=colour0,bg=colour14,nobold] SYSMEDIC #[fg=colour15,bg=colour4,bold] #{?#{==:#{session_name},ai-cloud},AI rescue · cloud (OpenCode Zen),AI rescue · offline (Qwen on this machine)} #[default] "
set -g status-right "#(python3 /usr/local/lib/sysmedic/statusline.py)"
set -g window-status-format ""
set -g window-status-current-format ""
set -g mouse off
set -g history-limit 20000
set -g default-terminal "tmux-256color"
# The Linux console says it has 8 colours, so tmux squeezed everything into 8 (dim grey became black, bright
# cyan plain cyan). It understands 256-colour codes and maps 0-15 straight onto SysMedic's palette (vtrgb).
set -as terminal-features ",linux*:256"
set -g escape-time 10
set -g remain-on-exit off
set -g aggressive-resize on
set -g destroy-unattached off
