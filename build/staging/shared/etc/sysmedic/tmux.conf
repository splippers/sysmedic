# SysMedic: the AI sessions shared by the console and the remote AI web terminal.
# No tmux keys at all: no prefix, no bindings, no command prompt. Whoever is attached (the laptop or the
# remote web terminal) can only talk to the AI program; there is no way to open a shell from here.
set -g prefix None
set -g prefix2 None
unbind-key -a
unbind-key -a -T root
unbind-key -a -T copy-mode
unbind-key -a -T copy-mode-vi
set -g status off
set -g mouse off
set -g history-limit 20000
set -g default-terminal "tmux-256color"
set -g escape-time 10
set -g remain-on-exit off
set -g aggressive-resize on
set -g destroy-unattached off
