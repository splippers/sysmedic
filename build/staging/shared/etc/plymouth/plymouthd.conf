# SysMedic Plymouth Configuration
# Use the text-mode script theme with our custom SysMedic animation

[Daemon]
Theme=sysmedic
ShowDelay=0
UseBackgroundColor=0
BackgroundColor=0x000000

[Daemon.Display]
# For text mode (framebuffer)
DefaultDisplay=0

[Daemon.Kernel]
# Don't show kernel messages
ShowBoot=0
ShowBootLog=0
ShowServices=0
ShowPassword=1
ShowPrompt=0
ShowProgress=1
ShowTime=0
ShowWelcome=0

[Daemon.Graphics]
# Framebuffer settings
ForceDrm=0
UseKernelDrm=1