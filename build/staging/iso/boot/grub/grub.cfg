set timeout=1
set default=0

loadfont unicode
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray
set gfxmode=1920x1080x32,auto
set gfxpayload=keep
insmod png
background_image /boot/grub/themes/sysmedic/background.png
set theme=/boot/grub/themes/sysmedic/theme.txt

menuentry "🩺 SysMedic Rescue (AI-powered) [DEFAULT]" {
    set gfxpayload=keep
    linux  /casper/vmlinuz  --- quiet loglevel=0 systemd.show_status=0 rd.udev.log_level=0 vt.global_cursor_default=0 plymouth.enable=1
    initrd /casper/initrd
}

menuentry "SysMedic (verbose boot)" {
    set gfxpayload=keep
    linux  /casper/vmlinuz  ---
    initrd /casper/initrd
}

menuentry "SysMedic (safe graphics)" {
    set gfxpayload=text
    linux  /casper/vmlinuz nomodeset  --- quiet loglevel=0 systemd.show_status=0 rd.udev.log_level=0 vt.global_cursor_default=0 plymouth.enable=1
    initrd /casper/initrd
}

if [ "$grub_platform" = "efi" ]; then
menuentry 'Memory test (MemTest86+) - turn Secure Boot off first' {
    chainloader /boot/memtest86+x64.efi
}
menuentry 'Boot from internal disk' {
    exit 1
}
menuentry 'UEFI Firmware Settings' {
    fwsetup
}
else
menuentry 'Memory test (MemTest86+)' {
    linux16 /boot/memtest86+x64.bin
}
fi
