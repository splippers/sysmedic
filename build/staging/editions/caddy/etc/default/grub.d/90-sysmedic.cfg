# SysMedic caddy boot menu (applied by update-grub; the deploy runs it)
GRUB_DEFAULT=0
GRUB_TIMEOUT=1
GRUB_TIMEOUT_STYLE=hidden
GRUB_DISTRIBUTOR="SysMedic"
GRUB_CMDLINE_LINUX_DEFAULT="mitigations=auto i915.enable_psr=0 video=1920x1080@60 quiet loglevel=0 systemd.show_status=0 rd.udev.log_level=0 vt.global_cursor_default=0 plymouth.enable=1"
GRUB_CMDLINE_LINUX=""
GRUB_DISABLE_OS_PROBER=true
GRUB_THEME=/boot/grub/themes/sysmedic/theme.txt
GRUB_BACKGROUND=
GRUB_GFXMODE=1920x1080x32,auto
GRUB_GFXPAYLOAD_LINUX=keep
